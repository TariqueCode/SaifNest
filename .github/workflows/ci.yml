name: SaifNest Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android-player/**'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build SaifNest Android player
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-player
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: saifnest-player-debug-apk
          path: android-player/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
