name: Android build

on:
  push:
    branches:
      - browser-first-rebuild
  pull_request:
    branches:
      - browser-first-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: Build SaifNest debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-player assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SaifNest-debug-apk
          path: android-player/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
