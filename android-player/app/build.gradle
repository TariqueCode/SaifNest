plugins { id 'com.android.application' }

android {
    namespace 'bd.saifnest.player'
    compileSdk 35
    defaultConfig {
        applicationId 'bd.saifnest.player'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
